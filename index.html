<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>24時間ルーティン時計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: auto;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-3 select-none">
  <div class="w-full max-w-md flex flex-col h-full space-y-4">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center py-2 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold tracking-wider text-indigo-400">24H ROUTINE</h1>
        <p id="current-time-text" class="text-xs text-slate-400">現在時刻: --:--:--</p>
      </div>
      <div class="flex gap-2">
        <button id="template-btn" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-slate-300">定型例</button>
        <button id="reset-btn" class="px-2.5 py-1 text-xs bg-rose-950/40 text-rose-300 hover:bg-rose-900/60 rounded border border-rose-800/50">初期化</button>
      </div>
    </header>

    <!-- 現在のアクティビティ カード -->
    <div id="current-task-card" class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl shadow-lg flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span id="current-task-icon" class="text-2xl p-2 bg-slate-700/50 rounded-lg">⏳</span>
        <div>
          <span class="text-[10px] tracking-widest uppercase font-semibold text-indigo-400">NOW ACTIVE</span>
          <h2 id="current-task-title" class="text-base font-bold text-slate-100">予定を確認中...</h2>
          <p id="current-task-time" class="text-xs text-slate-400">--:-- - --:--</p>
        </div>
      </div>
      <span id="current-task-badge" class="px-2 py-0.5 text-[11px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full">進行中</span>
    </div>

    <!-- 円グラフ時計表示エリア -->
    <div class="relative w-full aspect-square max-w-[340px] mx-auto flex items-center justify-center p-2">
      <svg id="clock-svg" viewBox="0 0 400 400" class="w-full h-full transform drop-shadow-2xl">
        <circle cx="200" cy="200" r="180" fill="#0f172a" stroke="#334155" stroke-width="2"/>
        <g id="dial-lines"></g>
        <g id="slices-group"></g>
        <circle cx="200" cy="200" r="90" fill="#0f172a" stroke="#334155" stroke-width="2"/>
        <g id="dial-labels"></g>
        <!-- 現在時刻針 -->
        <g id="needle-group">
          <line id="time-needle" x1="200" y1="200" x2="200" y2="25" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
          <circle cx="200" cy="200" r="6" fill="#f43f5e" />
        </g>
      </svg>
      <!-- 中央表示 -->
      <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <span id="center-clock" class="text-2xl font-black tracking-wider text-slate-100 font-mono">12:00</span>
        <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">24-HOUR CLOCK</span>
      </div>
    </div>

    <!-- 予定リスト & 集計タブ -->
    <div class="flex-1 bg-slate-800/40 rounded-xl p-3 border border-slate-800 flex flex-col">
      <div class="flex border-b border-slate-700/60 pb-2 mb-2">
        <button id="tab-list-btn" class="flex-1 text-center py-1 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-400">予定一覧</button>
        <button id="tab-stats-btn" class="flex-1 text-center py-1 text-xs font-semibold text-slate-400 border-b-2 border-transparent">24時間内訳</button>
      </div>

      <div id="tab-list-content" class="flex-1 overflow-y-auto max-h-48 space-y-2 pr-1"></div>
      <div id="tab-stats-content" class="hidden flex-1 overflow-y-auto max-h-48 space-y-2 pr-1"></div>
    </div>

    <!-- 追加ボタン -->
    <button id="open-modal-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
      <span class="text-lg">＋</span> 予定を追加する
    </button>
  </div>

  <!-- 予定追加・編集モーダル -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 id="modal-title" class="font-bold text-sm text-slate-100">予定の追加</h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-200 text-lg font-bold">×</button>
      </div>
      <form id="schedule-form" class="space-y-3">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">予定名</label>
          <div class="flex gap-2">
            <input type="text" id="schedule-icon" class="w-12 bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-lg" value="📝" maxlength="2">
            <input type="text" id="schedule-name" placeholder="例: 勉強、読書、散歩" required class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">開始時刻</label>
            <input type="time" id="start-time" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">終了時刻</label>
            <input type="time" id="end-time" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
          </div>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">カラー</label>
          <div id="color-picker" class="flex gap-2 flex-wrap"></div>
          <input type="hidden" id="schedule-color" value="#3b82f6">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="delete-btn" class="hidden flex-1 py-2 bg-rose-600/20 border border-rose-600/40 text-rose-300 rounded-lg text-xs font-semibold hover:bg-rose-600/30">削除</button>
          <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold shadow-md shadow-indigo-600/30">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b', '#f43f5e'];
    const DEFAULT_DATA = [
      { id: '1', title: '睡眠', icon: '😴', start: '00:00', end: '07:00', color: '#64748b' },
      { id: '2', title: '朝食・準備', icon: '🍳', start: '07:00', end: '08:30', color: '#f59e0b' },
      { id: '3', title: '仕事 / 作業', icon: '💻', start: '08:30', end: '12:00', color: '#3b82f6' },
      { id: '4', title: '昼食・休憩', icon: '🍱', start: '12:00', end: '13:00', color: '#10b981' },
      { id: '5', title: '仕事 / 作業', icon: '💼', start: '13:00', end: '18:00', color: '#3b82f6' },
      { id: '6', title: '運動・入浴', icon: '🏃', start: '18:00', end: '20:00', color: '#06b6d4' },
      { id: '7', title: '夕食・自由時間', icon: '🎮', start: '20:00', end: '23:30', color: '#8b5cf6' },
      { id: '8', title: '就寝準備', icon: '🌙', start: '23:30', end: '24:00', color: '#64748b' }
    ];

    let schedules = JSON.parse(localStorage.getItem('24h_schedules')) || DEFAULT_DATA;

    function saveSchedules() {
      localStorage.setItem('24h_schedules', JSON.stringify(schedules));
      renderClock();
      renderLists();
      renderStats();
      updateCurrentTask();
    }

    function timeToMinutes(t) {
      if (t === '24:00') return 1440;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToAngle(mins) {
      return (mins / 1440) * 360;
    }

    function polarToCartesian(cx, cy, r, angleDeg) {
      const rad = ((angleDeg - 90) * Math.PI) / 180.0;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function describeArc(cx, cy, rIn, rOut, startAngle, endAngle) {
      if (endAngle - startAngle >= 360) endAngle = startAngle + 359.99;
      const p1 = polarToCartesian(cx, cy, rOut, startAngle);
      const p2 = polarToCartesian(cx, cy, rOut, endAngle);
      const p3 = polarToCartesian(cx, cy, rIn, endAngle);
      const p4 = polarToCartesian(cx, cy, rIn, startAngle);
      const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
      return `M ${p1.x} ${p1.y} A ${rOut} ${rOut} 0 ${largeArc} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rIn} ${rIn} 0 ${largeArc} 0 ${p4.x} ${p4.y} Z`;
    }

    function initDial() {
      const dialLines = document.getElementById('dial-lines');
      const dialLabels = document.getElementById('dial-labels');
      dialLines.innerHTML = '';
      dialLabels.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const angle = (h / 24) * 360;
        const p1 = polarToCartesian(200, 200, 180, angle);
        const isMajor = h % 6 === 0;
        const p2 = polarToCartesian(200, 200, isMajor ? 166 : 172, angle);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x);
        line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x);
        line.setAttribute('y2', p2.y);
        line.setAttribute('stroke', isMajor ? '#94a3b8' : '#334155');
        line.setAttribute('stroke-width', isMajor ? '2' : '1');
        dialLines.appendChild(line);

        if (h % 3 === 0) {
          const lp = polarToCartesian(200, 200, 155, angle);
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', lp.x);
          text.setAttribute('y', lp.y + 4);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('font-size', '11');
          text.setAttribute('font-weight', isMajor ? '700' : '500');
          text.setAttribute('fill', isMajor ? '#cbd5e1' : '#64748b');
          text.textContent = `${h}`;
          dialLabels.appendChild(text);
        }
      }
    }

    function renderClock() {
      const g = document.getElementById('slices-group');
      g.innerHTML = '';

      schedules.forEach(item => {
        let startM = timeToMinutes(item.start);
        let endM = timeToMinutes(item.end);
        let spans = [];

        if (endM < startM) {
          spans.push({ s: startM, e: 1440 }, { s: 0, e: endM });
        } else {
          spans.push({ s: startM, e: endM });
        }

        spans.forEach(span => {
          if (span.s === span.e) return;
          const a1 = minutesToAngle(span.s);
          const a2 = minutesToAngle(span.e);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', describeArc(200, 200, 94, 176, a1, a2));
          path.setAttribute('fill', item.color);
          path.setAttribute('opacity', '0.85');
          path.setAttribute('stroke', '#0f172a');
          path.setAttribute('stroke-width', '1.5');
          path.classList.add('cursor-pointer', 'transition-opacity', 'hover:opacity-100');
          path.onclick = () => openEditModal(item.id);
          g.appendChild(path);

          if (span.e - span.s >= 60) {
            const mid = (a1 + a2) / 2;
            const pos = polarToCartesian(200, 200, 135, mid);
            const iconText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            iconText.setAttribute('x', pos.x);
            iconText.setAttribute('y', pos.y + 5);
            iconText.setAttribute('text-anchor', 'middle');
            iconText.setAttribute('font-size', '14');
            iconText.setAttribute('pointer-events', 'none');
            iconText.textContent = item.icon || '•';
            g.appendChild(iconText);
          }
        });
      });
    }

    function renderLists() {
      const container = document.getElementById('tab-list-content');
      container.innerHTML = '';
      const sorted = [...schedules].sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));

      sorted.forEach(item => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-800/70 hover:bg-slate-700/60 transition cursor-pointer border border-slate-700/40 text-xs';
        div.onclick = () => openEditModal(item.id);
        div.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${item.color};"></span>
            <span class="text-base">${item.icon}</span>
            <span class="font-bold text-slate-200">${item.title}</span>
          </div>
          <span class="text-slate-400 font-mono">${item.start} - ${item.end}</span>
        `;
        container.appendChild(div);
      });
    }

    function renderStats() {
      const container = document.getElementById('tab-stats-content');
      container.innerHTML = '';
      let totalMins = 0;
      const calc = schedules.map(item => {
        let sm = timeToMinutes(item.start);
        let em = timeToMinutes(item.end);
        let dur = em < sm ? (1440 - sm + em) : (em - sm);
        totalMins += dur;
        return { ...item, dur };
      });

      calc.forEach(item => {
        const hours = (item.dur / 60).toFixed(1);
        const pct = Math.round((item.dur / 1440) * 100);
        const row = document.createElement('div');
        row.className = 'space-y-1';
        row.innerHTML = `
          <div class="flex justify-between text-xs">
            <span class="flex items-center gap-1.5 font-medium text-slate-300">
              <span class="w-2.5 h-2.5 rounded-full" style="background:${item.color}"></span>
              ${item.icon} ${item.title}
            </span>
            <span class="text-slate-400 font-mono">${hours}h (${pct}%)</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-1.5 overflow-hidden">
            <div class="h-full rounded-full" style="width: ${pct}%; background-color: ${item.color}"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function updateClockNeedle() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const currentMinutes = h * 60 + m + s / 60;
      const angle = (currentMinutes / 1440) * 360;

      const p2 = polarToCartesian(200, 200, 178, angle);
      const needle = document.getElementById('time-needle');
      needle.setAttribute('x2', p2.x);
      needle.setAttribute('y2', p2.y);

      const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      document.getElementById('center-clock').textContent = timeStr;
      document.getElementById('current-time-text').textContent = `現在時刻: ${timeStr}:${String(s).padStart(2, '0')}`;
    }

    function updateCurrentTask() {
      const now = new Date();
      const currentM = now.getHours() * 60 + now.getMinutes();

      const active = schedules.find(item => {
        const sm = timeToMinutes(item.start);
        const em = timeToMinutes(item.end);
        if (em < sm) {
          return currentM >= sm || currentM < em;
        }
        return currentM >= sm && currentM < em;
      });

      if (active) {
        document.getElementById('current-task-icon').textContent = active.icon;
        document.getElementById('current-task-title').textContent = active.title;
        document.getElementById('current-task-time').textContent = `${active.start} - ${active.end}`;
        document.getElementById('current-task-badge').style.borderColor = active.color;
        document.getElementById('current-task-badge').style.color = active.color;
      } else {
        document.getElementById('current-task-icon').textContent = '☕';
        document.getElementById('current-task-title').textContent = '自由時間 / 予定なし';
        document.getElementById('current-task-time').textContent = '--:-- - --:--';
      }
    }

    function setupColorPicker() {
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-7 h-7 rounded-full border-2 border-transparent transition transform active:scale-90';
        btn.style.backgroundColor = c;
        btn.onclick = () => selectColor(c);
        picker.appendChild(btn);
      });
    }

    function selectColor(c) {
      document.getElementById('schedule-color').value = c;
      const btns = document.getElementById('color-picker').children;
      Array.from(btns).forEach(b => {
        b.style.borderColor = (b.style.backgroundColor === hexToRgb(c)) ? '#ffffff' : 'transparent';
      });
    }

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgb(${r}, ${g}, ${b})`;
    }

    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-title').textContent = '新しい予定を追加';
      document.getElementById('schedule-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('delete-btn').classList.add('hidden');
      selectColor(COLORS[0]);
    }

    function openEditModal(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-title').textContent = '予定を編集';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('schedule-icon').value = item.icon;
      document.getElementById('schedule-name').value = item.title;
      document.getElementById('start-time').value = item.start;
      document.getElementById('end-time').value = item.end;
      selectColor(item.color);
      document.getElementById('delete-btn').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    document.getElementById('open-modal-btn').onclick = openModal;
    document.getElementById('close-modal-btn').onclick = closeModal;

    document.getElementById('schedule-form').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('schedule-name').value;
      const icon = document.getElementById('schedule-icon').value || '📌';
      const start = document.getElementById('start-time').value;
      const end = document.getElementById('end-time').value;
      const color = document.getElementById('schedule-color').value;

      if (id) {
        const idx = schedules.findIndex(s => s.id === id);
        if (idx !== -1) schedules[idx] = { id, title, icon, start, end, color };
      } else {
        schedules.push({ id: Date.now().toString(), title, icon, start, end, color });
      }
      saveSchedules();
      closeModal();
    };

    document.getElementById('delete-btn').onclick = () => {
      const id = document.getElementById('edit-id').value;
      schedules = schedules.filter(s => s.id !== id);
      saveSchedules();
      closeModal();
    };

    document.getElementById('reset-btn').onclick = () => {
      if (confirm('予定をデフォルト状態にリセットしますか？')) {
        schedules = [...DEFAULT_DATA];
        saveSchedules();
      }
    };

    document.getElementById('template-btn').onclick = () => {
      schedules = [
        { id: '1', title: '睡眠', icon: '😴', start: '23:30', end: '06:30', color: '#64748b' },
        { id: '2', title: '朝活・読書', icon: '📖', start: '06:30', end: '08:00', color: '#10b981' },
        { id: '3', title: '集中作業', icon: '💻', start: '08:30', end: '12:00', color: '#3b82f6' },
        { id: '4', title: '昼食', icon: '🥗', start: '12:00', end: '13:00', color: '#f59e0b' },
        { id: '5', title: '作業・MTG', icon: '👥', start: '13:00', end: '18:00', color: '#3b82f6' },
        { id: '6', title: '自由時間', icon: '✨', start: '19:00', end: '23:30', color: '#8b5cf6' }
      ];
      saveSchedules();
    };

    const tabListBtn = document.getElementById('tab-list-btn');
    const tabStatsBtn = document.getElementById('tab-stats-btn');
    const tabList = document.getElementById('tab-list-content');
    const tabStats = document.getElementById('tab-stats-content');

    tabListBtn.onclick = () => {
      tabList.classList.remove('hidden');
      tabStats.classList.add('hidden');
      tabListBtn.className = 'flex-1 text-center py-1 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-400';
      tabStatsBtn.className = 'flex-1 text-center py-1 text-xs font-semibold text-slate-400 border-b-2 border-transparent';
    };

    tabStatsBtn.onclick = () => {
      tabList.classList.add('hidden');
      tabStats.classList.remove('hidden');
      tabStatsBtn.className = 'flex-1 text-center py-1 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-400';
      tabListBtn.className = 'flex-1 text-center py-1 text-xs font-semibold text-slate-400 border-b-2 border-transparent';
    };

    initDial();
    setupColorPicker();
    renderClock();
    renderLists();
    renderStats();
    updateClockNeedle();
    updateCurrentTask();
    setInterval(updateClockNeedle, 1000);
    setInterval(updateCurrentTask, 60000);
  </script>
</body>
</html>
